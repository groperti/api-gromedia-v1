services:
  cdn:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apiv2-media-v1
    restart: unless-stopped
    ports:
      - "4881:4881"
    # Single source of truth for secrets and config. Anything not in .env is
    # set explicitly below (Layer 1/2 perf knobs that aren't secret).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4881"
      # Layer 1 perf — enlarge the libuv worker pool so sharp.concurrency(1)
      # can spread N parallel encodes across N pool threads.
      UV_THREADPOOL_SIZE: "16"
      NODE_OPTIONS: "--max-old-space-size=1536"
      # Layer 2 admission control — keep MEDIA_MAX_INFLIGHT roughly equal to
      # UV_THREADPOOL_SIZE; anything beyond MEDIA_MAX_QUEUED is rejected with
      # 503 + Retry-After.
      MEDIA_MAX_INFLIGHT: "16"
      MEDIA_MAX_QUEUED: "32"
      MEDIA_RETRY_AFTER_SEC: "5"
      # Telegram alerts (UploadErrorAlertFilter). Bot token + chat id come
      # from .env so they aren't committed; this just enables the wiring.
      TELEGRAM_ALERTS_ENABLED: "1"

    # Resource caps — predictable OOM behaviour and CPU bound for capacity
    # planning. Tune in pair with MEDIA_MAX_INFLIGHT and UV_THREADPOOL_SIZE.
    mem_limit: 2g
    cpus: 2

    # Allow in-flight uploads up to 60s to finish before SIGKILL. tini in the
    # image forwards SIGTERM to node so the process can stop accepting new
    # work and drain the gate.
    stop_grace_period: 60s

    # Multer disk storage and ffmpeg both write here. Tmpfs is RAM-backed so
    # I/O is fast; capping it prevents an upload leak from filling host disk
    # OR exhausting RAM beyond mem_limit.
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g

    # Container is restarted when /health fails. /readyz (load-balancer
    # readiness) is intentionally NOT used here — saturation should drain via
    # the LB, not kill the container.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4881/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Bound log volume so a chatty error path can't fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
